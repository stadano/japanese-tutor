# Copy to wrangler.toml (gitignored) and fill in the ids.

name = "kenkou"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
HOME_TZ = "America/Los_Angeles"   # whose "today" the sync means

[[d1_databases]]
binding = "DB"
database_name = "kenkou"
database_id = "PASTE_THE_ID_HERE"

[triggers]
crons = ["0 11 * * *"]            # 11:00 UTC — after the watch has synced the night
